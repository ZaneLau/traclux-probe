name: Workbench demo Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/release_check.py
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm -s typecheck && pnpm test && pnpm generate:demo
        working-directory: frontend
        env:
          NUXT_PUBLIC_DEMO_MODE: 'true'
          NUXT_APP_BASE_URL: /traclux-probe/demo/
          NUXT_PUBLIC_ENABLE_ENGINE_THEATER: 'false'
      - run: python3 scripts/package_workbench_demo.py --output .pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
